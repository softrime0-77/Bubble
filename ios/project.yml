# XcodeGen 설정: `xcodegen generate`로 Bubble.xcodeproj를 만듭니다 (CI에서 자동 실행).
name: Bubble
options:
  bundleIdPrefix: com.bubble
  deploymentTarget:
    iOS: "16.0"
packages:
  BubbleCore:
    path: BubbleCore
targets:
  Bubble:
    type: application
    platform: iOS
    sources: [Bubble]
    dependencies:
      - package: BubbleCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bubble.game
        PRODUCT_NAME: Bubble
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bubble
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
