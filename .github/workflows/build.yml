name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # APK를 GitHub Release에 올리려면 쓰기 권한이 필요
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # 의존성을 캐시해서 매번 Maven Central에서 받지 않음 (429 Too Many Requests 방지)
          cache: gradle

      # GitHub 우분투 러너에는 Android SDK가 이미 설치돼 있음 (setup-android는 라이선스 수락 단계에서 실패해서 뺌)

      # 저장소 Secrets에 GOOGLE_SERVICES_JSON(파일 내용 그대로)을 넣으면 온라인 대전이 켜진 APK가 만들어집니다.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase 설정 적용"
          else
            echo "GOOGLE_SERVICES_JSON 없음: AI 연습 모드만 있는 APK를 만듭니다"
          fi

      # 구글 로그인은 Firebase에 등록한 SHA-1과 같은 키로 서명해야 동작합니다.
      # Secrets: BUBBLE_KEYSTORE_BASE64 (keystore/bubble.jks를 base64로), BUBBLE_KEYSTORE_PASSWORD
      - name: Signing key
        env:
          BUBBLE_KEYSTORE_BASE64: ${{ secrets.BUBBLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BUBBLE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$BUBBLE_KEYSTORE_BASE64" | base64 -d > keystore/bubble.jks
            echo "고정 서명 키 적용"
          else
            echo "BUBBLE_KEYSTORE_BASE64 없음: 임시 디버그 키로 서명합니다 (구글 로그인 안 됨)"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK / AAB
        env:
          BUBBLE_KEYSTORE_PASSWORD: ${{ secrets.BUBBLE_KEYSTORE_PASSWORD }}
        run: |
          if [ -f keystore/bubble.jks ] && [ -n "$BUBBLE_KEYSTORE_PASSWORD" ]; then
            ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bubble-builds
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/release/*.aab

      # main에서 서명된 release APK가 만들어졌으면 GitHub Release에 bubble.apk로 올림.
      # 고정 다운로드 링크: https://github.com/softrime0-77/Bubble/releases/latest/download/bubble.apk
      # (AAB는 Play Console 전용이라 공개 릴리스에는 올리지 않음)
      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' && hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          cp app/build/outputs/apk/release/app-release.apk bubble.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bubble.apk --clobber
          else
            gh release create "$TAG" bubble.apk --title "Bubble $VERSION" --notes "안드로이드 APK $VERSION" --latest
          fi
          echo "다운로드: https://github.com/${{ github.repository }}/releases/latest/download/bubble.apk"

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
