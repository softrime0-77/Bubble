# XcodeGen 설정: `xcodegen generate`로 Bubble.xcodeproj를 만듭니다 (CI에서 자동 실행).
name: Bubble
options:
  bundleIdPrefix: com.bubble
  deploymentTarget:
    iOS: "16.0"
packages:
  BubbleCore:
    path: BubbleCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
targets:
  Bubble:
    type: application
    platform: iOS
    sources: [Bubble]
    dependencies:
      - package: BubbleCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: GoogleSignIn
        product: GoogleSignIn
    scheme: {}
    # 구글 로그인 콜백용 URL scheme (REVERSED_CLIENT_ID, 비밀 아님)
    info:
      path: Bubble/Info.plist
      properties:
        CFBundleDisplayName: Bubble
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.googleusercontent.apps.92307501556-3agq5c7a1ihtfc8ssrckrmsr0hge71in]
          - CFBundleURLSchemes: [bubble]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bubble.game
        PRODUCT_NAME: Bubble
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
