name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # 서버(functions/src/apple.ts)가 고정해 둔 Apple 루트 인증서 지문이 진짜와 같은지 확인
      - name: Check pinned Apple Root CA G3 fingerprint
        run: |
          curl -fsSL -o root.cer https://www.apple.com/certificateauthority/AppleRootCA-G3.cer
          REAL=$(shasum -a 256 root.cer | cut -d' ' -f1 | tr a-f A-F)
          PINNED=$(grep -o 'APPLE_ROOT_G3_SHA256 = "[0-9A-F]*"' functions/src/apple.ts | grep -o '[0-9A-F]\{64\}')
          echo "real   $REAL"; echo "pinned $PINNED"
          test "$REAL" = "$PINNED"

      - name: Core tests (game rules, AI, ranks)
        working-directory: ios/BubbleCore
        run: swift test

      # 저장소 Secrets에 GOOGLE_SERVICE_INFO_PLIST(파일 내용 그대로)가 있으면 온라인 기능이 켜진 앱이 됨
      - name: Firebase config
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$PLIST" ]; then
            printf '%s' "$PLIST" > ios/Bubble/GoogleService-Info.plist
            echo "Firebase 설정 적용"
          else
            echo "GOOGLE_SERVICE_INFO_PLIST 없음: 온라인 기능 없이 빌드"
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          # 구글 로그인 콜백 URL scheme을 Firebase 설정 파일의 값으로 맞춤
          if [ -f Bubble/GoogleService-Info.plist ]; then
            REV=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" Bubble/GoogleService-Info.plist)
            /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $REV" Bubble/Info.plist
            echo "URL scheme: $REV"
            BID=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" Bubble/GoogleService-Info.plist)
            [ "$BID" = "com.softrime.bubble" ] || echo "::warning::GoogleService-Info.plist의 BUNDLE_ID($BID)가 앱(com.softrime.bubble)과 달라요. Firebase에 새 iOS 앱을 추가하고 plist를 바꿔 주세요."
          fi

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for simulator
        working-directory: ios
        run: |
          # 실패하면 오류 줄만 모아서 보여줌
          if ! xcodebuild build -project Bubble.xcodeproj -scheme Bubble \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            echo "===== errors ====="
            grep -E "error:|fatal error|Could not resolve|failed" build.log | sort -u | head -80
            echo "===== tail ====="
            tail -30 build.log
            exit 1
          fi
          tail -5 build.log

      - name: Screenshots
        working-directory: ios
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=build/Build/Products/Debug-iphonesimulator/Bubble.app
          mkdir -p shots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          shot() {
            xcrun simctl terminate "$UDID" com.softrime.bubble 2>/dev/null || true
            xcrun simctl launch "$UDID" com.softrime.bubble "${@:2}"
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/$1.png"
          }
          shot lobby_ko -lang ko
          shot lobby_in_ko -lang ko -demo lobby
          shot shop_ko -lang ko -demo shop
          shot revive_ko -lang ko -demo revive
          shot rankup_ko -lang ko -demo rankup
          shot checkin_ko -lang ko -demo checkin
          shot mission_ko -lang ko -demo mission
          shot game_ko -lang ko -demo game
          shot lobby_ja -lang ja
          shot shop_en -lang en -demo shop
          shot game_ar -lang ar -demo game

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios/shots/*.png

      # 스크린샷을 ios-screenshots 브랜치에도 올려서 바로 볼 수 있게 함 (main에는 영향 없음)
      - name: Publish screenshots to ios-screenshots branch
        if: success()
        working-directory: ios/shots
        run: |
          git init -q
          git checkout -q -b ios-screenshots
          git add *.png
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "iOS screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-screenshots
