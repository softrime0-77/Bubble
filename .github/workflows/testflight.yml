name: iOS TestFlight

# 아이폰 앱을 서명해서 App Store Connect(TestFlight)에 올립니다.
# Actions 탭 → "iOS TestFlight" → Run workflow 버튼으로 실행.
# 필요한 저장소 Secrets:
#   GOOGLE_SERVICE_INFO_PLIST  Firebase iOS 앱(com.softrime.bubble) 설정 파일 내용
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8  App Store Connect API 팀 키 (관리자 권한)
#   APPLE_TEAM_ID              Apple 팀 ID
# 서명 인증서·프로비저닝 프로파일은 API 키로 Xcode가 자동으로 만들고 관리합니다 (클라우드 서명).

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for v in PLIST ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret 없음: $v"; missing=1; fi
          done
          echo "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY" || { echo "::error::ASC_KEY_P8에 .p8 파일 내용 전체(BEGIN PRIVATE KEY 줄 포함)를 넣어 주세요"; missing=1; }
          exit $missing

      # App Store 업로드는 Xcode 26(iOS 26 SDK) 이상으로 빌드해야 함 (2027년 4월부터는 Xcode 27).
      # 러너에 있는 Xcode 중 26 이상의 가장 새 정식 버전을 고름
      - name: Select Xcode 26+
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::러너에 Xcode 26 이상이 없어요"; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Firebase config and API key
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$PLIST" > ios/Bubble/GoogleService-Info.plist
          BID=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" ios/Bubble/GoogleService-Info.plist)
          if [ "$BID" != "com.softrime.bubble" ]; then
            echo "::error::GoogleService-Info.plist의 BUNDLE_ID가 $BID 예요. Firebase의 com.softrime.bubble iOS 앱 설정 파일로 바꿔 주세요"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          REV=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" Bubble/GoogleService-Info.plist)
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $REV" Bubble/Info.plist

      # Xcode 자동 서명은 계정에 등록된 아이폰이 하나도 없으면 프로파일을 못 만듦.
      # 등록된 기기가 없을 때만 자리표시 기기 1개를 등록 (연간 기기 100대 한도 중 1개 사용).
      - name: Make sure the team has a device
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          import jwt
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "keys", f"AuthKey_{os.environ['ASC_KEY_ID']}.p8")).read()
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def api(path, body=None):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path,
                                           data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(req))
          devices = api("/v1/devices?filter[platform]=IOS&filter[status]=ENABLED&limit=1")["data"]
          if devices:
              print("등록된 기기가 있어요:", devices[0]["attributes"]["name"])
          else:
              h = hashlib.sha256(("bubble-ci-" + os.environ["APPLE_TEAM_ID"]).encode()).hexdigest().upper()
              udid = "00008110-" + h[:16]
              api("/v1/devices", {"data": {"type": "devices", "attributes": {
                  "name": "CI placeholder (TestFlight build)", "udid": udid, "platform": "IOS"}}})
              print("자리표시 기기를 등록했어요:", udid)
          PY

      # 빌드 번호는 이 워크플로 실행 번호 (올릴 때마다 커짐)

      - name: Archive (signed)
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if ! xcodebuild archive -project Bubble.xcodeproj -scheme Bubble -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Bubble.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} > archive.log 2>&1; then
            echo "===== errors ====="
            grep -E "error:|fatal error|No profiles|No signing|provision|certificate" archive.log | sort -u | head -80
            echo "===== tail ====="
            tail -40 archive.log
            exit 1
          fi
          tail -5 archive.log

      - name: Upload to App Store Connect (TestFlight)
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          if ! xcodebuild -exportArchive -archivePath build/Bubble.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1; then
            echo "===== errors ====="
            grep -E "error|Error|ITMS|invalid|Invalid" export.log | sort -u | head -80
            echo "===== tail ====="
            tail -40 export.log
            exit 1
          fi
          tail -15 export.log
          echo "업로드 완료: 빌드 1.0 (${{ github.run_number }}). App Store Connect에서 처리(10~30분) 후 TestFlight에 나타납니다."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
