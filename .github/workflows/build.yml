name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # 저장소 Secrets에 GOOGLE_SERVICES_JSON(파일 내용 그대로)을 넣으면 온라인 대전이 켜진 APK가 만들어집니다.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase 설정 적용"
          else
            echo "GOOGLE_SERVICES_JSON 없음: AI 연습 모드만 있는 APK를 만듭니다"
          fi

      # 구글 로그인은 Firebase에 등록한 SHA-1과 같은 키로 서명해야 동작합니다.
      # Secrets: BUBBLE_KEYSTORE_BASE64 (keystore/bubble.jks를 base64로), BUBBLE_KEYSTORE_PASSWORD
      - name: Signing key
        env:
          BUBBLE_KEYSTORE_BASE64: ${{ secrets.BUBBLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BUBBLE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$BUBBLE_KEYSTORE_BASE64" | base64 -d > keystore/bubble.jks
            echo "고정 서명 키 적용"
          else
            echo "BUBBLE_KEYSTORE_BASE64 없음: 임시 디버그 키로 서명합니다 (구글 로그인 안 됨)"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        env:
          BUBBLE_KEYSTORE_PASSWORD: ${{ secrets.BUBBLE_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bubble-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
